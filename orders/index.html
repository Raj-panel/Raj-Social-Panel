<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Raj SMM Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="https://rajsmmpanel.in" class="text-xl font-bold text-indigo-600">Raj SMM Panel</a>
            <a href="https://rajsmmpanel.in" class="text-sm text-gray-600 hover:text-indigo-600 font-medium">← Back to Store</a>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">My Orders</h1>
            <p class="text-sm text-gray-500 mt-1">Track your active and completed SMM service orders in real-time.</p>
        </div>

        <div id="orders-container" class="space-y-4">
            <!-- Loading State -->
            <p class="text-center text-gray-500">Loading your orders...</p>
        </div>

        <div id="no-orders-state" class="hidden text-center py-16 px-4 bg-white rounded-xl border border-gray-200 shadow-sm">
            <div class="text-4xl mb-3">📦</div>
            <h3 class="text-lg font-semibold text-gray-800">No Orders Found</h3>
            <p class="text-sm text-gray-500 mt-1 max-w-sm mx-auto">You haven't placed any order yet.</p>
            <a href="https://rajsmmpanel.in" class="mt-5 inline-block bg-indigo-600 text-white font-medium text-sm px-5 py-2.5 rounded-lg hover:bg-indigo-700 transition-colors">Browse Services</a>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500">
        &copy; 2026 Raj SMM Panel. All rights reserved.
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { auth, db } from "../firebase-config.js";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                fetchUserOrders(user.uid);
            } else {
                document.getElementById('orders-container').innerHTML = '<p class="text-center text-red-500">Please login to view your orders.</p>';
            }
        });

        function fetchUserOrders(uid) {
            const container = document.getElementById('orders-container');
            const noOrdersState = document.getElementById('no-orders-state');
            
            const q = query(collection(db, "orders"), where("userId", "==", uid), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = '';
                    noOrdersState.classList.remove('hidden');
                    return;
                }

                noOrdersState.classList.add('hidden');
                container.innerHTML = '';

                snapshot.forEach((doc) => {
                    const order = doc.data();
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl border border-gray-200 shadow-sm p-5';
                    card.innerHTML = `
                        <div class="flex justify-between items-center pb-4 border-b">
                            <h4 class="font-bold text-gray-800">Order #${doc.id.slice(-6)}</h4>
                            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800">${order.status || 'Pending'}</span>
                        </div>
                        <div class="py-4 text-sm">
                            <p><strong>Service:</strong> ${order.serviceName}</p>
                            <p><strong>Quantity:</strong> ${order.quantity}</p>
                            <p><strong>Link:</strong> <a href="${order.link}" class="text-indigo-600 underline">${order.link}</a></p>
                        </div>
                        <div class="pt-3 border-t text-xs text-gray-500 flex justify-between">
                            <span>${order.createdAt?.toDate().toLocaleDateString()}</span>
                            <span class="font-bold text-gray-900">₹${order.amount}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }
    </script>
</body>
</html>
