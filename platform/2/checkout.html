<!-- ========================================== -->
<!-- CHECKOUT OVERLAY / MODAL HTML CODE -->
<!-- ========================================== -->
<div id="checkoutPage" style="display: none;">
    <div class="checkout-modal">
        <!-- Modal Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px;">
            <h3 style="margin: 0; font-size: 16px; font-weight: 800; color: #0f172a;">Checkout Payment</h3>
            <span onclick="closeCheckout()" style="font-size: 22px; font-weight: bold; cursor: pointer; color: #64748b; line-height: 1;">&times;</span>
        </div>

        <!-- Service & Platform Info -->
        <div id="checkoutServiceTitle" style="font-size: 14px; font-weight: 700; color: #a855f7; margin-bottom: 12px; text-align: center;">
            <!-- JavaScript dynamically fills title here -->
        </div>

        <!-- QR Code Display Box -->
        <div id="checkoutUpiView" style="text-align: center; background: #f8fafc; border: 1px dashed #a855f7; border-radius: 12px; padding: 12px; margin-bottom: 15px;">
            <h4 id="scanToPayHeading" style="margin: 0 0 8px 0; font-size: 12px; font-weight: 800; color: #9333ea; text-transform: uppercase; letter-spacing: 0.5px;">
                SCAN TO PAY VIA UPI
            </h4>
            <img id="checkoutQrImg" src="" alt="UPI QR Code" style="width: 140px; height: 140px; object-fit: contain; border-radius: 8px; border: 1px solid #cbd5e1; padding: 4px; background: #ffffff; display: block; margin: 0 auto;">
            
            <div style="font-size: 15px; font-weight: 800; color: #16a34a; margin-top: 8px;">
                Total Amount: ₹<span id="checkoutPriceText">0.00</span> INR
            </div>
        </div>

        <!-- UTR / Transaction ID Input Field -->
        <div class="input-box" style="margin-bottom: 15px;">
            <label for="checkoutTxnId" class="utr-label" style="font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 6px; display: block;">
                Transaction ID / UTR Number <span style="color: #ef4444;">*</span>
            </label>
            <input type="text" id="checkoutTxnId" placeholder="Enter 12-digit UTR or Txn ID" required style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; font-size: 14px; font-weight: 600; box-sizing: border-box; outline: none;">
        </div>

        <!-- Action Button -->
        <button type="button" class="action-btn" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: #ffffff; font-size: 15px; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);" onclick="submitOrderToWhatsApp()">
            Confirm Your Order
        </button>
    </div>
</div>
