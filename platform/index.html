<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raj SMM Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Sidebar (Same as before) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar(true)"></div>
  <div class="left-sidebar" id="leftSidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">𝐑𝐀𝐉-𝐒𝐌𝐌-𝐏𝐀𝐍𝐄𝐋</div>
      <button class="sidebar-close-btn" onclick="closeSidebar(true)"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <ul class="sidebar-menu">
      <li><a href="../login/">🔐 Login / Create Account</a></li>
      <li><a href="../">🛒 New Order</a></li>
      <li><a href="../orders/">📦 My Orders</a></li>
      <li><a href="../pages/privacy-policy.html">🔒 Privacy Policy</a></li>
      <li><a href="../pages/contact.html">📞 Contact Us</a></li>
    </ul>
  </div>

  <div class="platform-container">
    <button class="menu-trigger" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>

    <!-- 3D Glass Header -->
    <div class="hero-branding">
      <div class="crown">👑</div>
      <h1 class="raj-title">Raj</h1>
      <p class="smm-sub">SMM PANEL</p>
    </div>

    <!-- 4 Apps (No Action) -->
    <div class="apps-grid">
      <div class="app-icon insta"><i class="fa-brands fa-instagram"></i></div>
      <div class="app-icon fb"><i class="fa-brands fa-facebook"></i></div>
      <div class="app-icon yt"><i class="fa-brands fa-youtube"></i></div>
      <div class="app-icon tt"><i class="fa-brands fa-tiktok"></i></div>
    </div>

    <!-- Quality Cards -->
    <div class="quality-cards">
      <div class="glass-card" onclick="window.location.href='../index.html#services'">
        <div class="icon-box"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="text">
          <h3>100% Real Organic Service</h3>
          <p>100% Real & Organic Followers</p>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </div>

      <div class="glass-card" onclick="showComingSoon()">
        <div class="icon-box diamond"><i class="fa-solid fa-gem"></i></div>
        <div class="text">
          <h3>Superfast Premium Quality</h3>
          <p>Premium Quality Service</p>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
      </div>
    </div>

    <!-- Tutorial -->
    <div class="tutorial-section">
      <a href="https://youtu.be/vsRlXbdNaoU" target="_blank" class="watch-btn">
        <i class="fa-brands fa-youtube"></i> WATCH TUTORIALS
      </a>
      <a href="https://youtu.be/vsRlXbdNaoU" target="_blank" class="thumb-link">
        <img src="../thumbnail.png" alt="Tutorial">
      </a>
    </div>
  </div>

  <div class="modal" id="comingSoonModal" onclick="this.classList.remove('active')">
    <div class="modal-content"><h2>COMING SOON</h2><p>Launching Soon!</p></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
