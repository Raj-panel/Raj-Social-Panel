<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Raj Social Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="../style.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="auth-page-body">

<div class="auth-page-wrapper">
  <div class="auth-card-box">
    
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-sub">Please fill in the details to sign up</p>
    </div>

    <div class="auth-input-group">
      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="Enter your full name">
    </div>

    <div class="auth-input-group">
      <label>Mobile Number</label>
      <div class="phone-input-wrapper">
        <span class="country-code">+91</span>
        <input type="tel" id="signupMobile" placeholder="Enter 10-digit number" maxlength="10">
      </div>
    </div>

    <div class="auth-input-group">
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Create password">
    </div>

    <div class="auth-input-group">
      <label>Confirm Password</label>
      <input type="password" id="signupConfirmPassword" placeholder="Confirm password">
    </div>

    <button onclick="handleSignUp()" class="auth-btn">Create Account</button>

    <p class="auth-switch-text">
      Already have an account? <a href="/login/">Back to Login</a>
    </p>

  </div>
</div>

<!-- Firebase Auth Handler Integration -->
<script type="module" src="../auth-handler.js"></script>
</body>
</html>
