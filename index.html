<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f0d13;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .checkout-card {
            background-color: #16121e;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            background: #231d2e;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .title {
            flex-grow: 1;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-right: 40px;
        }
        .service-box {
            background: #231b36;
            border: 1px solid #3c2a5c;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .service-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .service-icon {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        .service-details h4 {
            font-size: 15px;
            color: #fff;
        }
        .popular-badge {
            background: #d4a017;
            color: #000;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 5px;
        }
        .package-text {
            color: #a0a0a0;
            font-size: 12px;
            margin-top: 4px;
        }
        .price {
            font-size: 22px;
            font-weight: bold;
            margin-top: 10px;
        }
        .price span {
            font-size: 12px;
            color: #888;
            font-weight: normal;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #231d2e;
            border: 1px solid #3a3247;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #7b2cbf;
        }
        .payment-methods {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .pay-btn {
            flex: 1;
            padding: 10px;
            background: #281d3c;
            border: 1px solid #5a388a;
            color: #fff;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }
        .notice {
            background: #262013;
            border-left: 3px solid #d4a017;
            padding: 10px;
            font-size: 11px;
            color: #d4a017;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .confirm-btn {
            width: 100%;
            padding: 14px;
            background: #107c41;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .confirm-btn:hover {
            background: #0e6b37;
        }
    </style>
</head>
<body>

<div class="checkout-card">
    <div class="header">
        <button class="back-btn" onclick="history.back()">← Back</button>
        <div class="title">Checkout</div>
    </div>

    <div class="service-box">
        <div class="service-info">
            <div class="service-icon" id="platformIcon">📷</div>
            <div class="service-details">
                <h4 id="serviceTitle">Instagram - Followers 25+% EXTRA <span class="popular-badge">POPULAR</span></h4>
                <div class="package-text">1,000 Package</div>
            </div>
        </div>
        <div class="price">₹50.00 <span>one-time</span></div>
    </div>

    <!-- Platform Selection Option -->
    <div class="form-group">
        <label for="platformSelect">Select Platform</label>
        <select id="platformSelect" onchange="updatePlatform()">
            <option value="instagram">Instagram</option>
            <option value="facebook">Facebook</option>
        </select>
    </div>

    <!-- Dynamic Profile Link Input -->
    <div class="form-group">
        <label id="linkLabel" for="profileLink">Profile Link</label>
        <input type="text" id="profileLink" placeholder="https://www.instagram.com/your_username">
    </div>

    <div class="payment-methods">
        <div class="pay-btn">📱 UPI QR Code</div>
        <div class="pay-btn">💼 Binance Pay</div>
    </div>

    <div class="form-group">
        <label>Submit Order (Transaction ID / UTR)</label>
        <input type="text" id="transactionId" placeholder="Enter Transaction ID / UTR">
    </div>

    <div class="notice">
        ⚠️ After completing payment, enter the Transaction ID / UTR and submit order.
    </div>

    <button class="confirm-btn" onclick="submitOrder()">
        💬 Confirm your order
    </button>
</div>

<script>
    // প্ল্যাটফর্ম পরিবর্তন হলে Placeholder এবং Label আপডেট হবে
    function updatePlatform() {
        const platform = document.getElementById("platformSelect").value;
        const profileInput = document.getElementById("profileLink");
        const serviceTitle = document.getElementById("serviceTitle");
        const platformIcon = document.getElementById("platformIcon");

        if (platform === "instagram") {
            profileInput.placeholder = "https://www.instagram.com/your_username";
            serviceTitle.innerHTML = 'Instagram - Followers 25+% EXTRA <span class="popular-badge">POPULAR</span>';
            platformIcon.style.background = "radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%)";
            platformIcon.innerHTML = "📷";
        } else if (platform === "facebook") {
            profileInput.placeholder = "https://www.facebook.com/your_profile";
            serviceTitle.innerHTML = 'Facebook - Followers/Likes <span class="popular-badge">POPULAR</span>';
            platformIcon.style.background = "#1877F2";
            platformIcon.innerHTML = "👍";
        }
    }

    // Instagram URL Validation (সব ধরণের সঠিক লিংক গ্রহণ করবে)
    function isValidInstagramUrl(url) {
        return url.includes("instagram.com/") || url.includes("instagr.am/");
    }

    // Facebook URL Validation (সব ধরণের সঠিক লিংক গ্রহণ করবে)
    function isValidFacebookUrl(url) {
        return url.includes("facebook.com/") || url.includes("fb.com/") || url.includes("fb.watch/");
    }

    // ফর্ম সাবমিশন ফাংশন
    function submitOrder() {
        const platform = document.getElementById("platformSelect").value;
        const profileLink = document.getElementById("profileLink").value.trim();
        const transactionId = document.getElementById("transactionId").value.trim();

        if (!profileLink) {
            alert("Please enter a Profile Link!");
            return;
        }

        // Instagram ভ্যালিডেশন চেক
        if (platform === "instagram") {
            if (!isValidInstagramUrl(profileLink)) {
                alert("Please enter a valid Instagram Profile Link!");
                return;
            }
        } 
        // Facebook ভ্যালিডেশন চেক
        else if (platform === "facebook") {
            if (!isValidFacebookUrl(profileLink)) {
                alert("Please enter a valid Facebook Profile Link!");
                return;
            }
        }

        if (!transactionId) {
            alert("Please enter your Transaction ID / UTR!");
            return;
        }

        // সবকিছু ঠিক থাকলে অর্ডার কনফার্ম হবে
        alert("Order Submitted Successfully!");
    }
</script>

</body>
</html>
