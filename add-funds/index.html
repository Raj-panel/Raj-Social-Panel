<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Funds - Payment Gateway</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="add-funds-container">
    <div class="fund-card">
      
      <!-- পেমেন্ট মেথড সিলেক্ট করার জন্য সুইচ বাটন -->
      <div class="payment-tabs">
        <button type="button" class="tab-btn active" id="tabQr" onclick="selectPaymentMethod('qr')">
          <i class="fa-solid fa-qrcode"></i> QR Pay
        </button>
        <button type="button" class="tab-btn" id="tabBinance" onclick="selectPaymentMethod('binance')">
          <i class="fa-solid fa-coins"></i> Binance Pay
        </button>
      </div>

      <h2 id="methodTitle"><i class="fa-solid fa-wallet" style="color: #ec4899;"></i> Add Funds via UPI</h2>
      
      <!-- কালারিং ও গ্লোয়িং বর্ডারযুক্ত কিউআর কোড বক্স -->
      <div class="qr-code-wrapper">
        <div class="qr-code-box">
          <img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=rajsmmpanel@jio%26pn=Raj%20SMM%20Panel" alt="Payment QR Code">
        </div>
      </div>

      <!-- কিউআর কোড ডাউনলোড বাটন -->
      <button type="button" class="download-qr-btn" onclick="downloadQRCode()">
        <i class="fa-solid fa-circle-down"></i> Download QR Code
      </button>

      <p class="scan-notice" id="scanNotice">Scan QR using any UPI App (GPay, PhonePe, Paytm) or Download to Pay</p>

      <form id="addFundForm" onsubmit="handleFundSubmit(event)">
        <div class="form-group">
          <label id="utrLabel">Enter UTR / Transaction ID</label>
          <input type="text" id="utrInput" class="form-control" placeholder="Enter UTR or Transaction ID" required>
        </div>

        <div class="form-group">
          <label>Enter Amount Paid</label>
          <input type="number" id="amountInput" class="form-control" placeholder="e.g. 100" min="1" oninput="updateQrCode(this.value)" required>
        </div>

        <button type="submit" class="submit-fund-btn">Submit Payment</button>
      </form>

      <a href="../index.html" class="back-home-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>

  <script>
    const upiId = "rajsmmpanel@jio";
    const name = "Raj SMM Panel";
    const binanceQrUrl = "https://raw.githubusercontent.com/Raj-panel/Raj-Social-Panel/main/binance-qr.png";
    
    let currentMethod = 'qr'; // ডিফল্টভাবে QR Pay সিলেক্ট থাকবে

    // পেমেন্ট মেথড চেঞ্জ করার ফাংশন
    function selectPaymentMethod(method) {
      currentMethod = method;
      const tabQr = document.getElementById('tabQr');
      const tabBinance = document.getElementById('tabBinance');
      const methodTitle = document.getElementById('methodTitle');
      const utrLabel = document.getElementById('utrLabel');
      const utrInput = document.getElementById('utrInput');
      const scanNotice = document.getElementById('scanNotice');
      const amountInput = document.getElementById('amountInput');

      if (method === 'qr') {
        tabQr.classList.add('active');
        tabBinance.classList.remove('active');
        
        methodTitle.innerHTML = `<i class="fa-solid fa-wallet" style="color: #ec4899;"></i> Add Funds via UPI`;
        utrLabel.innerText = "Enter UTR / Transaction ID";
        utrInput.placeholder = "Enter UTR or Transaction ID";
        scanNotice.innerText = "Scan QR using any UPI App (GPay, PhonePe, Paytm) or Download to Pay";
        
        // QR আপডেট
        updateQrCode(amountInput.value);
      } else if (method === 'binance') {
        tabBinance.classList.add('active');
        tabQr.classList.remove('active');
        
        methodTitle.innerHTML = `<i class="fa-solid fa-coins" style="color: #f3ba2f;"></i> Add Funds via Binance Pay`;
        utrLabel.innerText = "Enter Binance Order ID / TxID";
        utrInput.placeholder = "Enter Order ID or TxID";
        scanNotice.innerText = "Scan using Binance App to complete your payment";
        
        // Binance QR সেট
        document.getElementById('qrImg').src = binanceQrUrl;
      }
    }

    // ইউপিআই এর ক্ষেত্রে পরিমাণ লিখলে QR কোড ডায়নামিক করা
    function updateQrCode(amount) {
      if (currentMethod !== 'qr') return;
      
      const qrImg = document.getElementById('qrImg');
      if (amount && amount > 0) {
        const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR`;
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiUrl)}`;
      } else {
        const defaultUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}`;
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(defaultUrl)}`;
      }
    }

    // কিউআর কোড ডাউনলোড
    async function downloadQRCode() {
      const qrImg = document.getElementById('qrImg');
      try {
        const response = await fetch(qrImg.src);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const downloadLink = document.createElement('a');
        downloadLink.href = blobUrl;
        downloadLink.download = currentMethod === 'qr' ? 'UPI_Payment_QR.png' : 'Binance_Payment_QR.png';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(blobUrl);
      } catch (error) {
        alert("Unable to download automatically. Please long press or right-click the QR image to save.");
      }
    }

    // পেমেন্ট সাবমিট
    function handleFundSubmit(event) {
      event.preventDefault();
      
      const utr = document.getElementById('utrInput').value.trim();
      const amount = parseFloat(document.getElementById('amountInput').value);

      if(!utr || isNaN(amount) || amount <= 0) {
        alert('Please enter a valid Transaction/Order ID and Amount!');
        return;
      }

      let currentBalance = parseFloat(localStorage.getItem('user_wallet_balance')) || 0;
      currentBalance += amount;
      localStorage.setItem('user_wallet_balance', currentBalance);

      alert(`Payment Submitted Successfully!\nMethod: ${currentMethod.toUpperCase()}\nTransaction/Order ID: ${utr}\nAmount: $/${amount} added to account.`);
      
      window.location.href = '../index.html';
    }
  </script>

</body>
</html>
