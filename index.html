<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raj Social Panel - Premium Social Boost</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Container -->
    <div class="app-container">
        
        <!-- Hero / Top Banner Card -->
        <div class="hero-card instagram-boost-card">
            <div class="hero-header">
                <span class="hero-icon" id="heroLogoIcon"><i class="fa-brands fa-instagram"></i></span>
                <h1 id="heroTitle" class="hero-title">Instagram Boost</h1>
            </div>
            <p>Fast • Premium Quality • High Retention Services</p>
        </div>

        <!-- Platform Navigation Tabs -->
        <div class="platform-tabs">
            <button class="plat-btn active" id="btnInsta" onclick="switchPlatform('instagram')">
                <i class="fa-brands fa-instagram"></i> Instagram
            </button>
            <button class="plat-btn" id="btnFb" onclick="switchPlatform('facebook')">
                <i class="fa-brands fa-facebook"></i> Facebook
            </button>
            <button class="plat-btn" id="btnYt" onclick="switchPlatform('youtube')">
                <i class="fa-brands fa-youtube"></i> YouTube
            </button>
            <button class="plat-btn" id="btnTt" onclick="switchPlatform('tiktok')">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </button>
        </div>

        <!-- Category Sub-Tabs -->
        <div class="category-tabs" id="categoryTabs">
            <!-- Dynamic Category Buttons Will Be Injected Here -->
        </div>

        <!-- Package List Container -->
        <div class="package-list" id="packageList">
            <!-- Dynamic Service Packages Will Be Injected Here -->
        </div>

        <!-- Footer Note -->
        <div class="footer-note">
            ⚡ Fast Processing • 100% Refund Guarantee If Failed
        </div>

        <!-- Dynamic Install App Button Container -->
        <div id="installContainer" style="display:none;">
            <button class="install-btn" id="installBtn">
                <i class="fa-solid fa-download"></i> Install App
            </button>
        </div>

    </div>

    <!-- Checkout Modal Overlay -->
    <div id="checkoutPage" class="checkout-overlay hidden">
        <div class="checkout-card">
            
            <!-- Close Button -->
            <button class="close-btn" onclick="closeCheckout()">&times;</button>
            
            <!-- Header Info -->
            <div class="checkout-header">
                <div class="checkout-platform-icon" id="checkoutPlatformIcon">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div>
                    <h2 id="checkoutServiceTitle">Instagram - Followers</h2>
                    <span id="checkoutPkgBadgeName" class="badge-sub">Package Name</span>
                </div>
            </div>

            <!-- Price & Quantity Bar -->
            <div class="checkout-price-box">
                <div>
                    <span class="pay-label">You Pay</span>
                    <div class="price-val">₹<span id="checkoutPriceText">0.00</span></div>
                    <span id="checkoutUsdtAmount" class="usdt-val">$0.00 USDT</span>
                </div>
                <!-- Quantity Multiplier Box Injected Dynamically -->
            </div>

            <!-- Payment Tabs -->
            <div class="payment-tabs">
                <button id="btnTabUpi" class="pay-tab active" onclick="switchCheckoutPayment('upi')">
                    <i class="fa-solid fa-qrcode"></i> UPI / QR Code
                </button>
                <button id="btnTabBinance" class="pay-tab" onclick="switchCheckoutPayment('binance')">
                    <i class="fa-solid fa-wallet"></i> Binance Pay
                </button>
            </div>

            <!-- UPI Payment View -->
            <div id="checkoutUpiView" class="payment-view">
                <!-- Scan Heading Injected Dynamically via JS -->
                <img id="checkoutQrImg" src="" alt="UPI QR Code">
                
                <div class="upi-app-btn-grid">
                    <button onclick="triggerUpiPay('gpay')" class="upi-btn gpay"><i class="fa-solid fa-mobile-screen"></i> GPay</button>
                    <button onclick="triggerUpiPay('phonepe')" class="upi-btn phonepe"><i class="fa-solid fa-mobile-screen"></i> PhonePe</button>
                    <button onclick="triggerUpiPay('paytm')" class="upi-btn paytm"><i class="fa-solid fa-mobile-screen"></i> Paytm</button>
                </div>
            </div>

            <!-- Binance Payment View -->
            <div id="checkoutBinanceView" class="payment-view hidden">
                <div class="binance-info">
                    <p>Pay via USDT (BEP20 / TRC20)</p>
                    <strong>Binance ID: 123456789</strong>
                </div>
            </div>

            <!-- Link & Transaction Inputs -->
            <div class="input-group">
                <label id="checkoutLinkLabel">Profile Link (Account Must be Public)</label>
                <input type="text" id="checkoutLinkInput" placeholder="https://instagram.com/your_username">
            </div>

            <div class="input-group">
                <label>Transaction ID / UTR Number</label>
                <input type="text" id="checkoutTxnId" placeholder="Enter 12-digit UTR/Txn ID after payment">
            </div>

            <!-- Submit Action Buttons -->
            <div class="checkout-actions">
                <button class="submit-btn wa-btn" onclick="submitOrderToWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i> Submit Order via WhatsApp
                </button>
                <button id="submitWalletBtn" class="submit-btn wallet-btn" onclick="submitOrderWithWallet()">
                    <i class="fa-solid fa-wallet"></i> Pay with Wallet Balance
                </button>
            </div>

        </div>
    </div>

    <!-- Main JavaScript Logic -->
    <script src="script.js"></script>

</body>
</html>
