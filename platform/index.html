<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raj SMM Panel - Platform</title>
    <link rel="stylesheet" href="platform.css">
</head>
<body class="platform-body">

    <div class="platform-container">
        
        <!-- Header / Hamburger Button -->
        <header class="platform-header">
            <button class="platform-menu-btn" id="platformMenuBtn" aria-label="Menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </header>

        <!-- Main Hero Card -->
        <main class="platform-hero-card">
            <div class="platform-crown">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="#ffb703"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
            </div>
            <h1 class="platform-logo-title">Raj</h1>
            <h2 class="platform-logo-subtitle">SMM PANEL</h2>
        </main>

        <!-- Social Media Grid -->
        <section class="platform-social-grid">
            <a href="#" class="platform-social-icon platform-fb">

            </a>
            <a href="#" class="platform-social-icon platform-yt">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#ffffff"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </a>
            <a href="#" class="platform-social-icon platform-tiktok">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#ffffff"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.82.57-1.34 1.53-1.36 2.53-.01.8.31 1.6.89 2.15.7.67 1.74.96 2.68.79 1.05-.17 1.98-.86 2.42-1.82.26-.54.37-1.15.36-1.75.02-4.57.01-9.14.01-13.71z"/></svg>

        </section>

        <!-- Services -->
        <section class="platform-services">
            
            <!-- Card 1 -->
            <a href="/services" class="platform-card" id="platformOrganicServiceCard">
                <div class="platform-card-icon platform-shield-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
                </div>
                <div class="platform-card-info">
                    <h3>100% Real Organic Service</h3>
                    <p>100% Real & Organic Followers</p>
                </div>
                <div class="platform-card-arrow">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>
            </a>

            <!-- Card 2 -->
            <div class="platform-card" id="platformHqServiceCard">
                <div class="platform-card-icon platform-gem-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><polygon points="6 3 18 3 22 9 12 22 2 9 6 3"></polygon><line x1="11" y1="3" x2="8" y2="9"></line><line x1="16" y1="9" x2="13" y2="3"></line></svg>
                </div>
                <div class="platform-card-info">
                    <h3>High Quality Service</h3>
                    <p>Best Quality Followers</p>
                </div>
                <div class="platform-card-arrow">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>
            </div>

            <!-- Tutorial Button -->
            <a href="https://www.youtube.com" class="platform-tutorial-btn" id="platformTutorialBtn" target="_blank">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff"><path d="M8 5v14l11-7z"/></svg>
                WATCH TUTORIALS
            </a>

            <!-- Tutorial Banner -->
            <div class="platform-banner-wrapper">
                <img src="https://rajsmmpanel.in/assets/images/tutorial-banner.jpg" alt="Raj SMM Panel Tutorial" class="platform-banner-img" onerror="this.style.display='none'">
            </div>

        </section>

    </div>

    <!-- Modal -->
    <div class="platform-modal-overlay" id="platformModal">
        <div class="platform-modal-content">
            <div class="platform-modal-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><polygon points="6 3 18 3 22 9 12 22 2 9 6 3"></polygon></svg>
            </div>
            <h2>COMING SOON</h2>
            <p>Premium High-Quality Services are launching soon. Stay tuned!</p>
            <button class="platform-modal-close" id="platformModalClose">Got It</button>
        </div>
    </div>

    <script src="platform.js"></script>
</body>
</html>
