<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Raj SMM Panel</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .info-container { max-width: 900px; margin: 40px auto; padding: 0 20px; font-family: inherit; color: inherit; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; padding: 10px 18px; background: var(--primary-color, #4f46e5); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 500; }
        .modern-card { background: var(--card-bg, #ffffff); border: 1px solid var(--border-color, #e5e7eb); border-radius: 16px; padding: 30px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .contact-box { background: var(--bg-subtle, #f9fafb); border: 1px solid var(--border-color, #e5e7eb); border-radius: 12px; padding: 24px; text-align: center; }
        .contact-icon { font-size: 36px; margin-bottom: 12px; display: block; }
        .contact-box h3 { margin: 0 0 8px 0; color: var(--heading-color, #111827); font-size: 1.1rem; }
        .contact-box p { margin: 0; color: var(--text-muted, #4b5563); font-size: 0.95rem; word-break: break-all; }
        .contact-box a { color: inherit; text-decoration: none; }
        .contact-box a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <main class="info-container">
        <a href="../index.html" class="back-btn">← Back to Home</a>

        <div class="modern-card">
            <h1>📞 Contact Us</h1>
            <p>Get in touch with our team for prompt assistance and service queries.</p>

            <div class="contact-grid">
                <!-- Card 1: WhatsApp / Phone Support -->
                <div class="contact-box">
                    <span class="contact-icon">💬</span>
                    <h3>WhatsApp / Call Support</h3>
                    <p><a href="https://wa.me/919239628344" target="_blank">+91 92396 28344</a></p>
                </div>

                <!-- Card 2: Telegram Support -->
                <div class="contact-box">
                    <span class="contact-icon">✈️</span>
                    <h3>Telegram Support</h3>
                    <p><a href="https://t.me/raj_smm_panel" target="_blank">t.me/raj_smm_panel</a></p>
                </div>

                <!-- Card 3: Email Support -->
                <div class="contact-box">
                    <span class="contact-icon">📧</span>
                    <h3>Email</h3>
                    <p><a href="mailto:support@rajsmmpanel.in">support@rajsmmpanel.in</a></p>
                </div>

                <!-- Card 4: Business Hours -->
                <div class="contact-box">
                    <span class="contact-icon">🕒</span>
                    <h3>Business Hours</h3>
                    <p>24×7 Customer Support</p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
