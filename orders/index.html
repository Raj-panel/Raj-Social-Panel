<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Raj SMM Panel</title>
    <!-- STYLE 08 EXTERNAL STYLESHEET (NO INLINE CSS) -->
    <link rel="stylesheet" href="./stylish.css">
</head>
<body>

    <!-- Header / Navbar Placeholder -->
    <header class="orders-navbar">
        <div class="navbar-inner">
            <a href="https://rajsmmpanel.in" class="brand-logo">Raj SMM Panel</a>
            <a href="https://rajsmmpanel.in" class="btn-back-store">
                <span>←</span> Back to Store
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="orders-page-wrapper">
        
        <!-- Style 08 Banner Hero -->
        <section class="style08-banner">
            <div class="banner-icon-wrapper">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                </svg>
            </div>
            <div>
                <h1 class="banner-title">My Orders</h1>
                <p class="banner-subtitle">Track your active and completed SMM service orders in real-time.</p>
            </div>
        </section>

        <!-- Search & Filter Controls -->
        <section class="controls-wrapper">
            <div class="search-box-container">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" id="orderSearchInput" onkeyup="filterOrdersBySearch()" placeholder="Search by Order ID or Service Name..." class="search-input">
            </div>

            <div class="filter-tabs-container">
                <button onclick="filterOrdersByStatus('all')" class="tab-btn active" data-filter="all">All Orders</button>
                <button onclick="filterOrdersByStatus('Completed')" class="tab-btn" data-filter="Completed">Completed</button>
                <button onclick="filterOrdersByStatus('Pending')" class="tab-btn" data-filter="Pending">Pending</button>
                <button onclick="filterOrdersByStatus('Processing')" class="tab-btn" data-filter="Processing">Processing</button>
            </div>
        </section>

        <!-- Orders Container (IDs Preserved for JavaScript Rendering) -->
        <div id="orders-container" class="orders-list-container">
            <!-- Dynamic Order Cards Inject Here -->
        </div>

        <!-- No Orders State (Hidden by Default - ID Preserved) -->
        <div id="no-orders-state" class="no-orders-card hidden">
            <div class="no-orders-icon">📦</div>
            <h3 class="no-orders-title">No Orders Found</h3>
            <p class="no-orders-desc">You haven't placed any order yet. Explore our services and start growing your social media today!</p>
            <a href="https://rajsmmpanel.in" class="btn-browse-services">Browse Services</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="page-footer">
        &copy; 2026 Raj SMM Panel. All rights reserved.
    </footer>

    <!-- Firebase / Auth / Order Management Integration (ES6 Module) -->
    <script type="module">
        import { renderOrders, getUserIdentifier } from './orders-manager.js';

        // 1. Search Filter Logic
        window.filterOrdersBySearch = function() {
            const query = document.getElementById('orderSearchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.order-item-node');
            cards.forEach(card => {
                const id = card.getAttribute('data-id') ? card.getAttribute('data-id').toLowerCase() : '';
                const service = card.getAttribute('data-service') ? card.getAttribute('data-service').toLowerCase() : '';
                if (id.includes(query) || service.includes(query)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        };

        // 2. Status Tab Filter Logic
        window.filterOrdersByStatus = function(status) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                if (tab.getAttribute('data-filter') === status) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            const cards = document.querySelectorAll('.order-item-node');
            cards.forEach(card => {
                if (status === 'all' || card.getAttribute('data-status') === status) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        };

        // DOM লোড হওয়ার পর অর্ডার রেন্ডার শুরু করা
        document.addEventListener('DOMContentLoaded', () => {
            renderOrders();
            // অটোমেটিক ১০ সেকেন্ড পর পর আপডেট রাখা
            setInterval(renderOrders, 10000);
        });
    </script>
</body>
</html>
