<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Panel Order Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Place Your Order</h2>

        <!-- Link Input Field -->
        <div class="form-group">
            <label for="link">Target Link / URL:</label>
            <input type="url" id="link" placeholder="https://instagram.com/your-profile" required>
        </div>

        <!-- Package Selection Section -->
        <h3>Select a Package</h3>
        <div class="package-list">
            <div class="package-card" onclick="selectPackage(this, '1000 Followers', 50, 1000, 'Followers', 'PROV_01')">
                <h4>1000 Followers</h4>
                <p class="price">$50.00</p>
                <p>Quantity: 1000</p>
            </div>

            <div class="package-card" onclick="selectPackage(this, '2500 Followers', 100, 2500, 'Followers', 'PROV_01')">
                <h4>2500 Followers</h4>
                <p class="price">$100.00</p>
                <p>Quantity: 2500</p>
            </div>

            <div class="package-card" onclick="selectPackage(this, '5000 Followers', 180, 5000, 'Followers', 'PROV_01')">
                <h4>5000 Followers</h4>
                <p class="price">$180.00</p>
                <p>Quantity: 5000</p>
            </div>
        </div>

        <!-- Payment Section -->
        <h3>Payment Details</h3>
        <div class="form-group">
            <label for="utrNumber">UTR / Transaction ID:</label>
            <input type="text" id="utrNumber" placeholder="Enter 12-digit UTR Number" required>
        </div>

        <!-- Submit Button -->
        <button class="btn-submit" onclick="confirmPaymentWithUTR()">Confirm Order</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
