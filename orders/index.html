<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Raj SMM Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Style 08 Custom Styling -->
    <link rel="stylesheet" href="./stylish.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navbar Placeholder -->
    <header class="border-b style08-card rounded-none sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="https://rajsmmpanel.in" class="text-xl font-extrabold gradient-text">Raj SMM Panel</a>
            <a href="https://rajsmmpanel.in" class="text-xs sm:text-sm font-semibold px-4 py-2 rounded-full border border-purple-500/30 text-purple-400 hover:bg-purple-500/10 transition-all flex items-center gap-1">
                ← Back to Store
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6">
        
        <!-- Style 08 Hero Section -->
        <div class="style08-card p-6 mb-6 flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-purple-500/30 flex-shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight">My Orders</h1>
                <p class="text-xs sm:text-sm opacity-70 mt-0.5">Track your active and completed SMM service orders in real-time.</p>
            </div>
        </div>

        <!-- Search & Status Filters UI (Style 08 Visuals) -->
        <div class="space-y-4 mb-6">
            <div class="relative">
                <input type="text" id="searchInput" onkeyup="filterOrdersUI()" placeholder="Search by Order ID..." class="w-full pl-10 pr-4 py-3 rounded-xl style08-card text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/50">
                <svg class="w-4 h-4 absolute left-3.5 top-3.5 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>

            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="filterStatus('all')" class="tab-btn px-4 py-2 rounded-full text-xs font-semibold bg-gradient-to-r from-purple-600 to-pink-500 text-white shadow-md">All Orders</button>
                <button onclick="filterStatus('Completed')" class="tab-btn px-4 py-2 rounded-full text-xs font-semibold style08-card opacity-80 hover:opacity-100">Completed</button>
                <button onclick="filterStatus('Pending')" class="tab-btn px-4 py-2 rounded-full text-xs font-semibold style08-card opacity-80 hover:opacity-100">Pending</button>
                <button onclick="filterStatus('Processing')" class="tab-btn px-4 py-2 rounded-full text-xs font-semibold style08-card opacity-80 hover:opacity-100">Processing</button>
            </div>
        </div>

        <!-- Orders Container (IDs Preserved) -->
        <div id="orders-container" class="space-y-4">
            <!-- Dynamic Order Cards Will Inject Here -->
        </div>

        <!-- No Orders State (Hidden by Default - Preserved) -->
        <div id="no-orders-state" class="hidden text-center py-16 px-4 style08-card">
            <div class="text-5xl mb-3">📦</div>
            <h3 class="text-lg font-bold">No Orders Found</h3>
            <p class="text-xs sm:text-sm opacity-70 mt-1 max-w-sm mx-auto">You haven't placed any order yet. Explore our services and start growing your social media today!</p>
            <a href="https://rajsmmpanel.in" class="mt-5 inline-block bg-gradient-to-r from-purple-600 to-pink-500 text-white font-semibold text-xs px-6 py-3 rounded-xl shadow-lg shadow-purple-500/20 hover:opacity-95 transition-all">Browse Services</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="style08-card rounded-none border-t border-b-0 py-6 text-center text-xs opacity-60">
        &copy; 2026 Raj SMM Panel. All rights reserved.
    </footer>

    <!-- Order Logic & Management Script (ORIGINAL LOGIC - UNTOUCHED) -->
    <script>
        /**
         * User Identifier Utility
         * - Firebase UID: window.firebaseUserUid (or check standard auth state if defined globally)
         * - Browser ID: Stored in localStorage as 'raj_smm_browser_id' if not logged in.
         */
        function getUserIdentifier() {
            if (typeof window.firebaseUserUid !== 'undefined' && window.firebaseUserUid) {
                return window.firebaseUserUid;
            }
            let browserId = localStorage.getItem('raj_smm_browser_id');
            if (!browserId) {
                browserId = 'BID_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('raj_smm_browser_id', browserId);
            }
            return browserId;
        }

        /**
         * Calculate Automatic Status based on Order Time
         */
        function calculateOrderStatus(orderTimeEpoch) {
            const now = Date.now();
            const elapsedMs = now - orderTimeEpoch;
            const elapsedMinutes = elapsedMs / (1000 * 60);

            if (elapsedMinutes < 5) {
                return { label: 'Pending', bg: 'status-pill-Pending', text: '', dot: 'bg-yellow-400' };
            } else if (elapsedMinutes < 60) {
                return { label: 'Processing', bg: 'status-pill-Processing', text: '', dot: 'bg-purple-400' };
            } else {
                return { label: 'Completed', bg: 'status-pill-Completed', text: '', dot: 'bg-green-400' };
            }
        }

        /**
         * Render Orders Function (Preserved & Redesigned Card Output)
         */
        function renderOrders() {
            const container = document.getElementById('orders-container');
            const noOrdersState = document.getElementById('no-orders-state');
            
            const currentUser = getUserIdentifier();
            const allOrders = JSON.parse(localStorage.getItem('raj_smm_orders') || '[]');

            // Filter orders belonging strictly to current user identifier
            const userOrders = allOrders.filter(order => order.userIdentifier === currentUser);

            if (userOrders.length === 0) {
                container.innerHTML = '';
                noOrdersState.classList.remove('hidden');
                return;
            }

            noOrdersState.classList.add('hidden');
            container.innerHTML = '';

            // Sort orders descending (newest first)
            userOrders.sort((a, b) => b.orderTimeEpoch - a.orderTimeEpoch);

            userOrders.forEach(order => {
                const status = calculateOrderStatus(order.orderTimeEpoch);
                const formattedDate = new Date(order.orderTimeEpoch).toLocaleString('en-US', {
                    month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                const card = document.createElement('div');
                card.className = 'style08-card p-5 order-item-card';
                card.setAttribute('data-status', status.label);
                card.setAttribute('data-id', order.orderId);

                card.innerHTML = `
                    <div class="flex items-center justify-between pb-3.5 border-b border-purple-500/10">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-semibold opacity-50">#${order.orderId}</span>
                        </div>
                        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full ${status.bg} text-xs font-bold">
                            <span class="w-2 h-2 rounded-full ${status.dot}"></span>
                            ${status.label}
                        </div>
                    </div>

                    <div class="py-3.5 space-y-3 text-sm">
                        <div>
                            <span class="text-xs opacity-50 block mb-0.5">Service Name</span>
                            <span class="font-semibold text-sm sm:text-base leading-snug block">${order.serviceName}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-2 bg-purple-500/5 p-2.5 rounded-xl border border-purple-500/10">
                            <div>
                                <span class="text-[11px] opacity-50 block">Quantity</span>
                                <span class="font-bold text-xs text-purple-400">${order.quantity}</span>
                            </div>
                            <div class="overflow-hidden">
                                <span class="text-[11px] opacity-50 block">Target Link</span>
                                <a href="${order.link}" target="_blank" rel="noopener noreferrer" class="font-medium text-xs text-pink-400 hover:underline truncate block">${order.link}</a>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-purple-500/10 text-xs opacity-70">
                        <span>${formattedDate}</span>
                        <span class="font-extrabold text-sm gradient-text">₹${order.amount}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Search & Status Filter UI Helper (Optional UI Enhancements)
        function filterOrdersUI() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.order-item-card');
            cards.forEach(card => {
                const id = card.getAttribute('data-id').toLowerCase();
                if(id.includes(query)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        function filterStatus(status) {
            const cards = document.querySelectorAll('.order-item-card');
            cards.forEach(card => {
                if(status === 'all' || card.getAttribute('data-status') === status) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // Initialize render on page load
        renderOrders();

        // Automatically refresh UI status every 10 seconds without requiring manual page refresh
        setInterval(renderOrders, 10000);
    </script>
</body>
</html>
