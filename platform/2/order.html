<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Raj SMM Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        /* Search Bar */
        .search-box {
            margin-bottom: 15px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        /* Filter Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            overflow-x: auto;
        }
        .tab-btn {
            padding: 8px 16px;
            border: none;
            background: #e9ecef;
            color: #495057;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: #007bff;
            color: #fff;
        }
        /* Table Style */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
            color: #333;
        }
        /* Status Badges */
        .badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }
        .badge-pending { background: #ffeeba; color: #856404; }
        .badge-processing { background: #b8daff; color: #004085; }
        .badge-completed { background: #c3e6cb; color: #155724; }
    </style>
</head>
<body>

<div class="container">
    <h2>My Orders / অর্ডার স্ট্যাটাস</h2>

    <!-- Search Section -->
    <div class="search-box">
        <input type="text" id="searchInput" onkeyup="filterOrders()" placeholder="Search by Order ID or Service ID...">
    </div>

    <!-- Filter Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="filterTab('all', this)">All Orders</button>
        <button class="tab-btn" onclick="filterTab('pending', this)">Pending</button>
        <button class="tab-btn" onclick="filterTab('processing', this)">Processing</button>
        <button class="tab-btn" onclick="filterTab('completed', this)">Completed</button>
    </div>

    <!-- Orders Table -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Service ID</th>
                    <th>Service Name</th>
                    <th>Link</th>
                    <th>Quantity</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="orderTableBody">
                <!-- Dynamic Content Loaded Via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // নমুনা অর্ডার ডাটা (টাইমস্ট্যাম্প সহ)
    // বাস্তব সিস্টেমে এটি ডাটাবেস বা LocalStorage থেকে আসবে
    const orders = [
        {
            orderId: "1001",
            serviceId: "SRV-50",
            serviceName: "Facebook Page Likes",
            link: "https://facebook.com/demo",
            quantity: 1000,
            orderTime: new Date().getTime() // এখন অর্ডার করা হলো
        },
        {
            orderId: "1000",
            serviceId: "SRV-12",
            serviceName: "Instagram Followers",
            link: "https://instagram.com/demo",
            quantity: 500,
            orderTime: new Date().getTime() - (6 * 60 * 1000) // ৬ মিনিট আগে অর্ডার করা (Processing দেখাবে)
        },
        {
            orderId: "999",
            serviceId: "SRV-05",
            serviceName: "YouTube Views",
            link: "https://youtube.com/demo",
            quantity: 2000,
            orderTime: new Date().getTime() - (90 * 60 * 1000) // ৯০ মিনিট আগে (Completed দেখাবে)
        }
    ];

    let currentFilter = 'all';

    // সময় অনুযায়ী স্ট্যাটাস নির্ধারণ করার ফনশন
    function getOrderStatus(orderTime) {
        const currentTime = new Date().getTime();
        const diffInMinutes = (currentTime - orderTime) / (1000 * 60);

        if (diffInMinutes < 5) {
            return { text: 'Pending', class: 'badge-pending' };
        } else if (diffInMinutes >= 5 && diffInMinutes < 60) {
            return { text: 'Processing', class: 'badge-processing' };
        } else {
            return { text: 'Completed', class: 'badge-completed' };
        }
    }

    // টেবিল রেন্ডার করা
    function renderOrders() {
        const tbody = document.getElementById('orderTableBody');
        tbody.innerHTML = '';

        orders.forEach(order => {
            const statusInfo = getOrderStatus(order.orderTime);
            
            // ফিল্টার লজিক check
            if (currentFilter !== 'all' && statusInfo.text.toLowerCase() !== currentFilter) {
                return;
            }

            const row = `
                <tr>
                    <td><b>#${order.orderId}</b></td>
                    <td>${order.serviceId}</td>
                    <td>${order.serviceName}</td>
                    <td><a href="${order.link}" target="_blank">View Link</a></td>
                    <td>${order.quantity}</td>
                    <td><span class="badge ${statusInfo.class}">${statusInfo.text}</span></td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    // ফিল্টার ট্যাব হ্যান্ডলার
    function filterTab(category, btn) {
        currentFilter = category;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderOrders();
    }

    // সার্চ আইডি ফনশন
    function filterOrders() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#orderTableBody tr');

        rows.forEach(row => {
            const orderId = row.cells[0].innerText.toLowerCase();
            const serviceId = row.cells[1].innerText.toLowerCase();
            
            if (orderId.includes(input) || serviceId.includes(input)) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

    // পেজ লোড হলে রেন্ডার হবে
    renderOrders();

    // প্রতি ১ মিনিটে অটোমেটিক স্ট্যাটাস আপডেট হবে (পেজ রিফ্রেশ ছাড়া)
    setInterval(renderOrders, 60000);
</script>

</body>
</html>
