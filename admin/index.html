<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAJ Admin - Control Panel Login</title>
  
  <!-- Manifest & Theme -->
  <link rel="manifest" href="admin-manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Custom Styling -->
  <link rel="stylesheet" href="admin-style.css">
</head>
<body>

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      
      <!-- Panel Header -->
      <div class="brand-header">
        <div class="logo-icon">🔐</div>
        <h2>RAJ ADMIN PANEL</h2>
        <p>অ্যাডমিন এক্সেস পাওয়ার জন্য লগইন করুন</p>
      </div>

      <!-- Login Form -->
      <form id="adminLoginForm" onsubmit="event.preventDefault();">
        
        <div class="form-group">
          <label for="adminMobile">মোবাইল নম্বর</label>
          <input 
            type="tel" 
            id="adminMobile" 
            placeholder="10 ডিজিটের নম্বর লিখুন" 
            maxlength="10" 
            required 
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="adminPassword">অ্যাডমিন পাসওয়ার্ড</label>
          <input 
            type="password" 
            id="adminPassword" 
            placeholder="আপনার পাসওয়ার্ড দিন" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="adminSecretKey">সিক্রেট সিকিউরিটি কী (Admin Key)</label>
          <input 
            type="password" 
            id="adminSecretKey" 
            placeholder="প্রদত্ত Secret Key লিখুন" 
            required 
          />
        </div>

        <!-- Alert Message Box -->
        <div id="loginAlert" class="alert-box" style="display: none;"></div>

        <button type="button" id="adminLoginBtn" class="btn-primary" onclick="handleAdminLogin()">
          লগইন করুন ➔
        </button>

      </form>

      <div class="card-footer">
        <a href="../" class="back-link">⬅ মূল ওয়েবসাইটে ফিরে যান</a>
      </div>

    </div>
  </div>

  <!-- Firebase & Admin Auth Scripts -->
  <script type="module" src="admin-auth.js"></script>
</body>
</html>
