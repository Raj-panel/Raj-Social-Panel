<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Raj Social Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  body {
    background-color: #fdf2f8;
    color: #1e293b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  /* Premium Branding / Header Section */
  .brand-header-section {
    width: 100%;
    max-width: 420px;
    text-align: center;
    margin-bottom: 20px;
  }

  .brand-logo-wrapper {
    display: inline-block;
    padding: 4px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(217, 70, 239, 0.25);
    margin-bottom: 14px;
    border: 1px solid #fae8ff;
  }

  .brand-logo-wrapper img {
    width: 65px;
    height: 65px;
    border-radius: 16px;
    object-fit: cover;
    display: block;
  }

  .brand-main-heading {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #3b82f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .brand-description {
    font-size: 12.5px;
    line-height: 1.5;
    color: #64748b;
    margin-bottom: 14px;
    padding: 0 10px;
    font-weight: 600;
  }

  .brand-social-icons {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .brand-social-icons a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #ffffff;
    color: #a855f7;
    font-size: 15px;
    box-shadow: 0 4px 12px rgba(168, 85, 247, 0.15);
    text-decoration: none;
    transition: transform 0.2s ease;
    border: 1px solid #f3e8ff;
  }

  .brand-social-icons a:hover {
    transform: translateY(-2px);
  }

  .brand-social-icons a.instagram { color: #e1306c; }
  .brand-social-icons a.facebook { color: #1877f2; }
  .brand-social-icons a.youtube { color: #ff0000; }

  /* Auth Card Box */
  .auth-card-box {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border: 1px solid #fae8ff;
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(244, 114, 182, 0.1);
  }

  .auth-title {
    font-size: 24px;
    font-weight: 800;
    text-align: center;
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
  }

  .auth-input-group {
    margin-bottom: 16px;
    text-align: left;
  }

  .auth-input-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #475569;
    margin-bottom: 6px;
  }

  .auth-input-group input {
    width: 100%;
    padding: 12px 14px;
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    font-size: 14px;
    color: #0f172a;
    outline: none;
    transition: all 0.2s;
  }

  .auth-input-group input:focus {
    border-color: #d946ef;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(217, 70, 239, 0.15);
  }

  .auth-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    margin-top: 8px;
    transition: transform 0.1s ease;
  }

  .auth-btn:active {
    transform: scale(0.98);
  }

  .auth-links {
    text-align: center;
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .auth-links a {
    font-size: 13px;
    color: #a855f7;
    text-decoration: none;
    font-weight: 700;
  }

  .auth-links a:hover {
    text-decoration: underline;
  }

  /* Automatic Dark Mode Support */
  @media (prefers-color-scheme: dark) {
    body {
      background-color: #0b0f19 !important;
      color: #f1f5f9 !important;
    }
    .brand-logo-wrapper {
      background: #111827 !important;
      border-color: #1f2937 !important;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4) !important;
    }
    .brand-description {
      color: #94a3b8 !important;
    }
    .brand-social-icons a {
      background: #111827 !important;
      border-color: #1f2937 !important;
    }
    .auth-card-box {
      background: #111827 !important;
      border-color: #1f2937 !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
    }
    .auth-input-group label {
      color: #cbd5e1 !important;
    }
    .auth-input-group input {
      background: #0b0f19 !important;
      border-color: #1f2937 !important;
      color: #ffffff !important;
    }
    .auth-input-group input:focus {
      border-color: #a855f7 !important;
      background: #111827 !important;
    }
  }
</style>
</head>
<body>

<!-- Premium Branding / Header Section -->
<div class="brand-header-section">
  <div class="brand-logo-wrapper">
    <!-- আপনার existing website-এর logo ইমেজ সোর্স এখানে বসাবেন (যেমন: logo.png বা আপনার ওয়েবসাইটের বর্তমান লোগো লিংক) -->
    <img src="../assets/logo.png" alt="Raj SMM Panel Logo" id="brandLogoImg">
  </div>
  <h1 class="brand-main-heading">INDIAN BEST SOCIAL MEDIA SERVICE</h1>
  <p class="brand-description">
    Your Ultimate Destination For Social Media Success. Affordable & Reliable Social Media Services for Instagram, YouTube & Facebook.
  </p>
  <div class="brand-social-icons">
    <a href="#" class="instagram" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="#" class="facebook" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
    <a href="#" class="youtube" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
  </div>
</div>

<div class="auth-card-box">
  
  <!-- Title -->
  <h2 class="auth-title">Login Account</h2>

  <!-- Input 1: Mobile Number -->
  <div class="auth-input-group">
    <label>Mobile Number</label>
    <input type="tel" id="loginMobile" placeholder="Mobile Number" maxlength="10">
  </div>

  <!-- Input 2: Password -->
  <div class="auth-input-group">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Password">
  </div>

  <!-- Login Button ( ফাংশন এবং আইডি একদম অপরিবর্তিত রাখা হয়েছে ) -->
  <button onclick="handleLogin()" class="auth-btn">Login</button>

  <!-- Links -->
  <div class="auth-links">
    <a href="/reset-password/">Forgot Password?</a>
    <a href="/register/">Create Account</a>
  </div>

</div>

<!-- Firebase Auth Handler Integration (অপরিবর্তিত) -->
<script type="module" src="../auth-handler.js"></script>
</body>
</html>
