<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Raj Social Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  body {
    background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 50%, #eff6ff 100%);
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px 12px;
  }

  .auth-card-box {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(250, 232, 255, 0.8);
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 20px 40px rgba(168, 85, 247, 0.08), 0 4px 12px rgba(0, 0, 0, 0.03);
  }

  .auth-title {
    font-size: 26px;
    font-weight: 800;
    text-align: center;
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
  }

  .auth-input-group {
    margin-bottom: 16px;
    text-align: left;
  }

  .auth-input-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #475569;
    margin-bottom: 6px;
  }

  .auth-input-group input {
    width: 100%;
    padding: 12px 14px;
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    font-size: 14px;
    color: #0f172a;
    outline: none;
    transition: all 0.2s;
  }

  .auth-input-group input:focus {
    border-color: #d946ef;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(217, 70, 239, 0.12);
  }

  .auth-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
    margin-top: 8px;
    transition: transform 0.1s ease, box-shadow 0.2s ease;
  }

  .auth-btn:hover {
    box-shadow: 0 10px 25px rgba(168, 85, 247, 0.35);
  }

  .auth-btn:active {
    transform: scale(0.98);
  }

  .auth-links {
    text-align: center;
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .auth-links a {
    font-size: 13px;
    color: #a855f7;
    text-decoration: none;
    font-weight: 700;
  }

  .auth-links a:hover {
    text-decoration: underline;
    color: #ec4899;
  }

  /* Password Validation Helper Text */
  .validation-text {
    font-size: 11.5px;
    margin-top: 5px;
    font-weight: 600;
    display: block;
  }

  /* Automatic Dark Mode Support */
  @media (prefers-color-scheme: dark) {
    body {
      background: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0f172a 100%) !important;
      color: #f1f5f9 !important;
    }
    .auth-card-box {
      background: rgba(17, 24, 39, 0.85) !important;
      border-color: rgba(31, 41, 55, 0.8) !important;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5) !important;
    }
    .auth-input-group label {
      color: #cbd5e1 !important;
    }
    .auth-input-group input {
      background: #0b0f19 !important;
      border-color: #1f2937 !important;
      color: #ffffff !important;
    }
    .auth-input-group input:focus {
      border-color: #a855f7 !important;
      background: #111827 !important;
    }
  }
</style>
</head>
<body>

<div class="auth-card-box">
  
  <!-- Title -->
  <h2 class="auth-title">Create Account</h2>

  <!-- Input: Name -->
  <div class="auth-input-group">
    <label>Full Name</label>
    <input type="text" id="signupName" placeholder="Full Name">
  </div>

  <!-- Input: Mobile Number -->
  <div class="auth-input-group">
    <label>Mobile Number</label>
    <input type="tel" id="signupMobile" placeholder="Mobile Number" maxlength="10">
  </div>

  <!-- Input: Password -->
  <div class="auth-input-group">
    <label>Password</label>
    <input type="password" id="signupPassword" placeholder="Password" oninput="checkPasswordValidation()">
    <span id="pwdValidationMsg" class="validation-text" style="color: #ef4444; display: none;">Password must be at least 6 characters</span>
  </div>

  <!-- Input: Confirm Password -->
  <div class="auth-input-group">
    <label>Confirm Password</label>
    <input type="password" id="signupConfirmPassword" placeholder="Confirm Password">
  </div>

  <!-- Register Button (onclick দিয়ে সরাসরি handleSignUp কল করা হয়েছে) -->
  <button type="button" onclick="handleSignUp()" class="auth-btn">Create Account</button>

  <!-- Links -->
  <div class="auth-links">
    <a href="/login/">Already have an account? Login</a>
  </div>

</div>

<!-- Password Validation & Firebase Auth Integration Script -->
<script>
  function checkPasswordValidation() {
    const password = document.getElementById('signupPassword').value;
    const msg = document.getElementById('pwdValidationMsg');
    
    if (password.length > 0 && password.length < 6) {
      msg.style.display = 'block';
      msg.style.color = '#ef4444';
      msg.innerText = 'Password must be at least 6 characters (Invalid)';
    } else if (password.length >= 6) {
      msg.style.display = 'block';
      msg.style.color = '#10b981';
      msg.innerText = 'Valid Password';
    } else {
      msg.style.display = 'none';
    }
  }
</script>

<!-- Firebase Auth Handler Integration (অপরিবর্তিত) -->
<script type="module" src="../auth-handler.js"></script>
</body>
</html>
