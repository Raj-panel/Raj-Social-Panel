<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAJ Admin - Control Panel Login</title>
  
  <!-- Manifest & Theme -->
  <link rel="manifest" href="admin-manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Custom Styling -->
  <link rel="stylesheet" href="admin-style.css">
</head>
<body>

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      
      <!-- Panel Header -->
      <div class="brand-header">
        <div class="logo-icon">🔐</div>
        <h2>RAJ ADMIN PANEL</h2>
        <p>Login to access the admin panel</p>
      </div>

      <!-- Login Form -->
      <form id="adminLoginForm" onsubmit="event.preventDefault();">
        
        <div class="form-group">
          <label for="adminEmail">Email Address</label>
          <input 
            type="email" 
            id="adminEmail" 
            placeholder="Enter your admin email" 
            required 
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="adminPassword">Admin Password</label>
          <input 
            type="password" 
            id="adminPassword" 
            placeholder="Enter your password" 
            required 
          />
        </div>

        <!-- Alert Message Box -->
        <div id="loginAlert" class="alert-box" style="display: none;"></div>

        <button type="button" id="adminLoginBtn" class="btn-primary" onclick="handleAdminLogin()">
          Login ➔
        </button>

      </form>

      <div class="card-footer">
        <a href="../" class="back-link">⬅ Back to Main Website</a>
      </div>

    </div>
  </div>

  <!-- Firebase & Admin Auth Scripts -->
  <script type="module" src="admin-auth.js"></script>
</body>
</html>
