<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Raj Social Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="../style.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="auth-page-body">

<div class="auth-page-wrapper">
  <div class="auth-card-box">
    
    <!-- Title Section matching the screenshot -->
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 class="auth-title" style="font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0;">Login Account</h2>
    </div>

    <!-- Input 1: Mobile Number -->
    <div class="auth-input-group">
      <label>Mobile Number</label>
      <input type="tel" id="loginMobile" placeholder="Mobile Number" maxlength="10">
    </div>

    <!-- Input 2: Password -->
    <div class="auth-input-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Password">
    </div>

    <!-- Login Button -->
    <button onclick="handleLogin()" class="auth-btn" style="margin-top: 6px; background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);">Login</button>

    <!-- Links / Navigation matching the screenshot -->
    <div style="text-align: center; margin-top: 18px; display: flex; flex-direction: column; gap: 12px;">
      <a href="/reset-password/" class="forgot-link" style="font-size: 13px; color: #a855f7; text-decoration: none; font-weight: 600;">Forgot Password?</a>
      <a href="/register/" style="font-size: 13px; color: #a855f7; text-decoration: none; font-weight: 600;">Create Account</a>
    </div>

  </div>
</div>

<!-- Firebase Auth Handler Integration -->
<script type="module" src="../auth-handler.js"></script>
</body>
</html>
