<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Raj SMM Panel</title>
    <!-- STYLE 08 EXTERNAL STYLESHEET (NO INLINE CSS) -->
    <link rel="stylesheet" href="./stylish.css">
    <style>
        /* Multi-select extra UI styling */
        .selection-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e2f;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #fff;
            font-size: 14px;
        }
        .selection-toolbar label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .btn-copy-selected {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-copy-selected:hover {
            background: #4338ca;
        }
        .order-card-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 15px;
        }
        .order-card-wrapper .order-card {
            flex: 1;
            margin-bottom: 0;
        }
        .order-checkbox {
            width: 18px;
            height: 18px;
            margin-top: 20px;
            cursor: pointer;
            accent-color: #4f46e5;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar Placeholder -->
    <header class="orders-navbar">
        <div class="navbar-inner">
            <a href="https://rajsmmpanel.in" class="brand-logo">Raj SMM Panel</a>
            <a href="https://rajsmmpanel.in" class="btn-back-store">
                <span>←</span> Back to Store
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="orders-page-wrapper">
        
        <!-- Style 08 Banner Hero -->
        <section class="style08-banner">
            <div class="banner-icon-wrapper">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                </svg>
            </div>
            <div>
                <h1 class="banner-title">My Orders</h1>
                <p class="banner-subtitle">Track your active and completed SMM service orders in real-time.</p>
            </div>
        </section>

        <!-- Search & Filter Controls -->
        <section class="controls-wrapper">
            <div class="search-box-container">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" id="orderSearchInput" onkeyup="filterOrdersBySearch()" placeholder="Search by Order ID or Service Name..." class="search-input">
            </div>

            <div class="filter-tabs-container">
                <button onclick="filterOrdersByStatus('all')" class="tab-btn active" data-filter="all">All Orders</button>
                <button onclick="filterOrdersByStatus('Completed')" class="tab-btn" data-filter="Completed">Completed</button>
                <button onclick="filterOrdersByStatus('Pending')" class="tab-btn" data-filter="Pending">Pending</button>
                <button onclick="filterOrdersByStatus('In Progress')" class="tab-btn" data-filter="In Progress">In Progress</button>
                <button onclick="filterOrdersByStatus('Processing')" class="tab-btn" data-filter="Processing">Processing</button>
            </div>
        </section>

        <!-- Multi-select Toolbar -->
        <div class="selection-toolbar">
            <label>
                <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)"> Select All Visible
            </label>
            <button class="btn-copy-selected" onclick="copySelectedOrderIds()">Copy Selected IDs</button>
        </div>

        <!-- Orders Container (IDs Preserved for JavaScript Rendering) -->
        <div id="orders-container" class="orders-list-container">
            <!-- Dynamic Order Cards Inject Here -->
        </div>

        <!-- No Orders State (Hidden by Default - ID Preserved) -->
        <div id="no-orders-state" class="no-orders-card hidden">
            <div class="no-orders-icon">📦</div>
            <h3 class="no-orders-title">No Orders Found</h3>
            <p class="no-orders-desc">You haven't placed any order yet. Explore our services and start growing your social media today!</p>
            <a href="https://rajsmmpanel.in" class="btn-browse-services">Browse Services</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="page-footer">
        &copy; 2026 Raj SMM Panel. All rights reserved.
    </footer>

    <!-- Order Logic & Management Script (UPDATED WITH MULTI-SELECT & COPY) -->
    <script>
        /**
         * User Identifier Utility
         */
        function getUserIdentifier() {
            if (typeof window.firebaseUserUid !== 'undefined' && window.firebaseUserUid) {
                return window.firebaseUserUid;
            }
            let browserId = localStorage.getItem('raj_smm_browser_id');
            if (!browserId) {
                browserId = 'BID_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('raj_smm_browser_id', browserId);
            }
            return browserId;
        }

        /**
         * Calculate Automatic Status based on Order Time
         * - 0 to 20 minutes: Pending
         * - 20 minutes to 120 minutes: In Progress
         * - 120 minutes to 420 minutes (7 hours): Processing
         * - After 7 hours: Completed
         */
        function calculateOrderStatus(orderTimeEpoch) {
            const now = Date.now();
            const elapsedMs = now - orderTimeEpoch;
            const elapsedMinutes = elapsedMs / (1000 * 60);

            if (elapsedMinutes < 20) {
                return { label: 'Pending', cssClass: 'status-pill-Pending' };
            } else if (elapsedMinutes < 120) {
                return { label: 'In Progress', cssClass: 'status-pill-In-Progress' };
            } else if (elapsedMinutes < 420) { 
                return { label: 'Processing', cssClass: 'status-pill-Processing' };
            } else {
                return { label: 'Completed', cssClass: 'status-pill-Completed' };
            }
        }

        /**
         * Render Orders Function
         */
        function renderOrders() {
            const container = document.getElementById('orders-container');
            const noOrdersState = document.getElementById('no-orders-state');
            
            const currentUser = getUserIdentifier();
            const allOrders = JSON.parse(localStorage.getItem('raj_smm_orders') || '[]');

            const userOrders = allOrders.filter(order => order.userIdentifier === currentUser);

            if (userOrders.length === 0) {
                container.innerHTML = '';
                noOrdersState.classList.remove('hidden');
                return;
            }

            noOrdersState.classList.add('hidden');
            container.innerHTML = '';

            userOrders.sort((a, b) => b.orderTimeEpoch - a.orderTimeEpoch);

            userOrders.forEach(order => {
                const status = calculateOrderStatus(order.orderTimeEpoch);
                const formattedDate = new Date(order.orderTimeEpoch).toLocaleString('en-US', {
                    month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                // Wrapper to hold checkbox + card together side-by-side
                const wrapper = document.createElement('div');
                wrapper.className = 'order-card-wrapper order-item-node';
                wrapper.setAttribute('data-status', status.label);
                wrapper.setAttribute('data-id', order.orderId || '');
                wrapper.setAttribute('data-service', (order.serviceName || '').toLowerCase());

                wrapper.innerHTML = `
                    <input type="checkbox" class="order-checkbox" value="${order.orderId}">
                    <div class="order-card">
                        <div class="card-header-row">
                            <div class="order-id-wrapper">
                                <span class="order-id-label">Order ID</span>
                                <h4 class="order-id-value">#${order.orderId}</h4>
                            </div>
                            <div class="status-pill ${status.cssClass}">
                                <span class="status-pill-dot"></span>
                                ${status.label}
                            </div>
                        </div>

                        <div class="card-body-content">
                            <div class="detail-block-full">
                                <span class="detail-label">Service Name</span>
                                <span class="service-title-value">${order.serviceName}</span>
                            </div>

                            <div class="card-details-grid">
                                <div class="detail-block-full">
                                    <span class="detail-label">Quantity</span>
                                    <span class="quantity-value-badge">${order.quantity}</span>
                                </div>
                                <div class="target-link-wrapper">
                                    <span class="detail-label">Target Link</span>
                                    <a href="${order.link}" target="_blank" rel="noopener noreferrer" class="target-link-anchor">${order.link}</a>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer-row">
                            <span>${formattedDate}</span>
                            <span class="price-tag-value">₹${order.amount}</span>
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            });
        }

        /**
         * Select All / Deselect All functionality
         */
        function toggleSelectAll(selectAllCheckbox) {
            const visibleCheckboxes = document.querySelectorAll('.order-item-node:not([style*="display: none"]) .order-checkbox');
            visibleCheckboxes.forEach(checkbox => {
                checkbox.checked = selectAllCheckbox.checked;
            });
        }

        /**
         * Copy Selected Order IDs to Clipboard
         */
        function copySelectedOrderIds() {
            const checkedBoxes = document.querySelectorAll('.order-item-node:not([style*="display: none"]) .order-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert('Please select at least one order ID to copy!');
                return;
            }

            const ids = Array.from(checkedBoxes).map(cb => cb.value);
            const textToCopy = ids.join(', ');

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert(`Successfully copied ${ids.length} order ID(s): ${textToCopy}`);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        /**
         * Optional Search Filter for UI
         */
        function filterOrdersBySearch() {
            const query = document.getElementById('orderSearchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.order-item-node');
            cards.forEach(card => {
                const id = card.getAttribute('data-id').toLowerCase();
                const service = card.getAttribute('data-service').toLowerCase();
                if (id.includes(query) || service.includes(query)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }

        /**
         * Optional Status Tab Filter for UI
         */
        function filterOrdersByStatus(status) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                if (tab.getAttribute('data-filter') === status) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            const cards = document.querySelectorAll('.order-item-node');
            cards.forEach(card => {
                if (status === 'all' || card.getAttribute('data-status') === status) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });

            // Reset select all checkbox when changing tabs
            document.getElementById('selectAllCheckbox').checked = false;
        }

        // Initialize render on page load
        renderOrders();

        // Refresh UI status every 10 seconds without requiring page refresh
        setInterval(renderOrders, 10000);
    </script>
</body>
</html>
