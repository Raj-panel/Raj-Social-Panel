<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Funds - UPI Payment</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- আপনার কাস্টম CSS ফাইল লিংক -->
  <link rel="stylesheet" href="add-funds.css">
</head>
<body>

  <div class="add-funds-container">
    <div class="fund-card">
      <h2><i class="fa-solid fa-wallet" style="color: #ec4899;"></i> Add Funds via UPI</h2>

      <!-- কালারিং বর্ডার সহ QR কোড -->
      <div class="qr-wrapper">
        <div class="qr-code-box">
          <img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=rajsmmpanel@jio%26pn=Raj%20SMM%20Panel" alt="UPI QR Code">
        </div>
      </div>

      <!-- ডাউনলোড বাটন -->
      <div>
        <button type="button" class="download-btn" onclick="downloadQRCode()">
          <i class="fa-solid fa-arrow-down"></i> Download QR Code
        </button>
      </div>

      <p style="font-size: 11px; color: var(--text-sub); margin-bottom: 15px;">Scan this QR code or download it to pay using GPay, PhonePe, or Paytm.</p>

      <form id="addFundForm" onsubmit="handleFundSubmit(event)">
        <!-- UTR বা Transaction ID ইনপুট -->
        <div class="form-group">
          <label>Enter UTR / Transaction ID</label>
          <input type="text" id="utrInput" class="form-control" placeholder="Enter UTR or Transaction ID" required>
        </div>

        <!-- অ্যামাউন্ট ইনপুট -->
        <div class="form-group">
          <label>Enter Amount Paid</label>
          <input type="number" id="amountInput" class="form-control" placeholder="Enter amount (e.g. 100)" min="1" oninput="updateQrCode(this.value)" required>
        </div>

        <button type="submit" class="submit-fund-btn">Submit Payment</button>
      </form>

      <a href="../index.html" class="back-home-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>

  <script>
    const upiId = "rajsmmpanel@jio";
    const name = "Raj SMM Panel";

    // ইনপুট ফিল্ডে টাকা টাইপ করলে ডায়নামিক QR কোড তৈরি হওয়া
    function updateQrCode(amount) {
      const qrImg = document.getElementById('qrImg');
      if (amount && amount > 0) {
        const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR`;
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiUrl)}`;
      } else {
        const defaultUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}`;
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(defaultUrl)}`;
      }
    }

    // QR কোড ইমেজ ডাউনলোড করার ফাংশন
    async function downloadQRCode() {
      const qrImg = document.getElementById('qrImg');
      try {
        const response = await fetch(qrImg.src);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = 'UPI-QR-Code.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      } catch (error) {
        alert('Downloading failed. Please long press on the QR code to save it.');
      }
    }

    // ফর্ম সাবমিট হ্যান্ডলার
    function handleFundSubmit(event) {
      event.preventDefault();
      
      const utr = document.getElementById('utrInput').value.trim();
      const amount = parseFloat(document.getElementById('amountInput').value);

      if(!utr || isNaN(amount) || amount <= 0) {
        alert('Please enter a valid UTR / Transaction ID and Amount!');
        return;
      }

      // ওয়ালেট ব্যালেন্স যোগ ও সেভ
      let currentBalance = parseFloat(localStorage.getItem('user_wallet_balance')) || 0;
      currentBalance += amount;
      localStorage.setItem('user_wallet_balance', currentBalance);

      alert(`Payment Successful! Successfully added ₹${amount} to your wallet.`);
      
      // হোম পেজে রিডাইরেক্ট
      window.location.href = '../index.html';
    }
  </script>

</body>
</html>
