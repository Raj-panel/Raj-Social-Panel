<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password - Raj Social Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  body {
    background-color: #fdf2f8;
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }

  .auth-card-box {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border: 1px solid #fae8ff;
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(244, 114, 182, 0.1);
  }

  .auth-title {
    font-size: 24px;
    font-weight: 800;
    text-align: center;
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
  }

  .auth-input-group {
    margin-bottom: 16px;
    text-align: left;
  }

  .auth-input-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #475569;
    margin-bottom: 6px;
  }

  .auth-input-group input {
    width: 100%;
    padding: 12px 14px;
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    font-size: 14px;
    color: #0f172a;
    outline: none;
    transition: all 0.2s;
  }

  .auth-input-group input:focus {
    border-color: #d946ef;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(217, 70, 239, 0.15);
  }

  .auth-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    margin-top: 8px;
    transition: transform 0.1s ease;
  }

  .auth-btn:active {
    transform: scale(0.98);
  }

  .auth-links {
    text-align: center;
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .auth-links a {
    font-size: 13px;
    color: #a855f7;
    text-decoration: none;
    font-weight: 700;
  }

  .auth-links a:hover {
    text-decoration: underline;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background-color: #0b0f19 !important;
      color: #f1f5f9 !important;
    }
    .auth-card-box {
      background: #111827 !important;
      border-color: #1f2937 !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
    }
    .auth-input-group label {
      color: #cbd5e1 !important;
    }
    .auth-input-group input {
      background: #0b0f19 !important;
      border-color: #1f2937 !important;
      color: #ffffff !important;
    }
    .auth-input-group input:focus {
      border-color: #a855f7 !important;
      background: #111827 !important;
    }
  }
</style>
</head>
<body>

<div class="auth-card-box">
  <h2 class="auth-title">Reset Password</h2>

  <!-- Mobile Number -->
  <div class="auth-input-group">
    <label>Mobile Number</label>
    <input type="tel" id="resetMobile" placeholder="Mobile Number" maxlength="10">
  </div>

  <!-- Send OTP Button -->
  <button onclick="handleSendOTP()" class="auth-btn">Send OTP</button>

  <!-- Firebase reCAPTCHA Container -->
  <div id="recaptcha-container" style="margin: 15px 0;"></div>

  <!-- OTP Input -->
  <div class="auth-input-group">
    <label>Enter OTP</label>
    <input type="text" id="resetOtp" placeholder="Enter 6-digit OTP" maxlength="6">
  </div>

  <!-- Verify OTP Button -->
  <button onclick="handleVerifyOTP()" class="auth-btn">Verify OTP</button>

  <!-- New Password -->
  <div class="auth-input-group">
    <label>New Password</label>
    <input type="password" id="resetNewPassword" placeholder="New Password" disabled>
  </div>

  <!-- Confirm New Password -->
  <div class="auth-input-group">
    <label>Confirm New Password</label>
    <input type="password" id="resetConfirmPassword" placeholder="Confirm Password" disabled>
  </div>

  <!-- Reset Password Button -->
  <button onclick="handleResetPassword()" class="auth-btn">Reset Password</button>

  <div class="auth-links">
    <a href="/login/">Back to Login</a>
  </div>
</div>

<script type="module" src="/auth-handler.js"></script>
</body>
</html>
