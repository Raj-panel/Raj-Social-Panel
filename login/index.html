<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Raj Social Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="../style.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="auth-page-body">

<div class="auth-page-wrapper">
  <div class="auth-card-box">
    
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-sub">Enter your mobile number and password to login</p>
    </div>

    <div class="auth-input-group">
      <label>Mobile Number</label>
      <div class="phone-input-wrapper">
        <span class="country-code">+91</span>
        <input type="tel" id="loginMobile" placeholder="Enter 10-digit number" maxlength="10">
      </div>
    </div>

    <div class="auth-input-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter password">
    </div>

    <div class="auth-extra-row">
      <a href="/reset-password/" class="forgot-link">Forgot Password?</a>
    </div>

    <button onclick="handleLogin()" class="auth-btn">Login</button>

    <p class="auth-switch-text">
      Don't have an account? <a href="/register/">Create Account</a>
    </p>

  </div>
</div>

<!-- Firebase Auth Handler Integration -->
<script type="module" src="../auth-handler.js"></script>
</body>
</html>
