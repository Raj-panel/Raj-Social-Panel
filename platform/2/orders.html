<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status - Platform 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation Bar -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="https://rajsmmpanel.in/platform/2/index.html">Raj SMM Platform 2</a>
            </div>
            <ul class="nav-menu">
                <li><a href="https://rajsmmpanel.in/platform/2/index.html">Home</a></li>
                <li><a href="https://rajsmmpanel.in/platform/2/orders.html">Order Status</a></li>
            </ul>
        </nav>
    </header>

    <!-- Order History Section -->
    <main class="container">
        <!-- ব্যাক বাটন লজিক (প্ল্যাটফর্ম ২ হোমে নিয়ে যাবে) -->
        <button class="btn-back" onclick="goBackToPlatform2()">← Back to Platform 2 Home</button>

        <h2>Platform 2 Order History</h2>
        
        <table class="order-table">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Service</th>
                    <th>Link</th>
                    <th>Quantity</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="orderList">
                <!-- JavaScript এর মাধ্যমে অর্ডার ডাটা এখানে আসবে -->
            </tbody>
        </table>
    </main>

    <script>
    // ১. ব্যাক বাটন চাপলে প্ল্যাটফর্ম ২ এ নিয়ে যাওয়ার লজিক
    function goBackToPlatform2() {
        window.location.href = "https://rajsmmpanel.in/platform/2/index.html";
    }

    // ২. প্ল্যাটফর্ম ২ এর সেভ হওয়া অর্ডারগুলো টেবিল আকারে দেখানো
    window.onload = function() {
        const orderListTable = document.getElementById("orderList");
        const orders = JSON.parse(localStorage.getItem('p2_orders')) || [];

        if (orders.length === 0) {
            orderListTable.innerHTML = "<tr><td colspan='6' style='text-align:center;'>No orders found for Platform 2.</td></tr>";
            return;
        }

        let tableRows = "";
        orders.forEach(order => {
            tableRows += `
                <tr>
                    <td><b>${order.id}</b></td>
                    <td>${order.service}</td>
                    <td><a href="${order.link}" target="_blank">View Link</a></td>
                    <td>${order.quantity}</td>
                    <td>${order.date}</td>
                    <td><span class="badge ${order.status.toLowerCase()}">${order.status}</span></td>
                </tr>
            `;
        });

        orderListTable.innerHTML = tableRows;
    };
    </script>
</body>
</html>
