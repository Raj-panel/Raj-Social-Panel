<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raj SMM Panel - Platform</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Modern Google Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="platform.css">
</head>
<body class="platform-body">

    <!-- Container wrapper to lock scope -->
    <div class="platform-container">
        
        <!-- Header / Hamburger Button -->
        <header class="platform-header">
            <button class="platform-menu-btn" id="platformMenuBtn" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
        </header>

        <!-- Main Hero Card -->
        <main class="platform-hero-card">
            <div class="platform-crown">
                <i class="fa-solid fa-crown"></i>
            </div>
            <h1 class="platform-logo-title">Raj</h1>
            <h2 class="platform-logo-subtitle">SMM PANEL</h2>
        </main>

        <!-- Social Media Grid -->
        <section class="platform-social-grid">
            <a href="#" class="platform-social-icon platform-fb" title="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="#" class="platform-social-icon platform-insta" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="#" class="platform-social-icon platform-yt" title="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="#" class="platform-social-icon platform-tiktok" title="TikTok">
                <i class="fa-brands fa-tiktok"></i>
            </a>
        </section>

        <!-- Service Cards Container -->
        <section class="platform-services">
            
            <!-- Card 1: 100% Real Organic Service -->
            <a href="/services" class="platform-card" id="platformOrganicServiceCard">
                <div class="platform-card-icon platform-shield-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="platform-card-info">
                    <h3>100% Real Organic Service</h3>
                    <p>100% Real & Organic Followers</p>
                </div>
                <div class="platform-card-arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </a>

            <!-- Card 2: High Quality Service (Triggers Modal) -->
            <div class="platform-card" id="platformHqServiceCard">
                <div class="platform-card-icon platform-gem-icon">
                    <i class="fa-solid fa-gem"></i>
                </div>
                <div class="platform-card-info">
                    <h3>High Quality Service</h3>
                    <p>Best Quality Followers</p>
                </div>
                <div class="platform-card-arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </div>

            <!-- Watch Tutorials Button -->
            <a href="#" class="platform-tutorial-btn" id="platformTutorialBtn" target="_blank">
                <i class="fa-solid fa-circle-play"></i> WATCH TUTORIALS
            </a>

            <!-- Tutorial Banner / Video Image -->
            <div class="platform-banner-wrapper">
                <img src="/assets/images/tutorial-banner.jpg" alt="Raj SMM Panel Tutorial" class="platform-banner-img" id="platformBannerImg">
            </div>

        </section>

    </div>

    <!-- Coming Soon Modal -->
    <div class="platform-modal-overlay" id="platformModal">
        <div class="platform-modal-content">
            <div class="platform-modal-icon">
                <i class="fa-solid fa-gem"></i>
            </div>
            <h2>COMING SOON</h2>
            <p>Premium High-Quality Services are launching soon. Stay tuned!</p>
            <button class="platform-modal-close" id="platformModalClose">Got It</button>
        </div>
    </div>

    <script src="platform.js"></script>
</body>
</html>
